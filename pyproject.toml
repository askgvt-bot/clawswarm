[project]
name = "clawswarm"
version = "0.1.0"
description = "Agent swarm orchestrator for OpenClaw - spin up/down AI agents on demand"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "docker>=7.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
clawswarm = "clawswarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
